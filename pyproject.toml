[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-with-me"
version = "0.1.0"
description = "A Pyxel game prototype scaffold for DriftWithMe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyxel==2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
drift-with-me = "drift_with_me.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_with_me = [
    "data/*.json",
    "assets/*.json",
    "assets/*.hex",
    "assets/*.pyxres",
    "assets/fonts/*.ttf",
    "assets/i18n/*.json",
    "assets/water_study/*.json",
    "assets/water_study/*.md",
    "assets/water_study/chunks_256/hex_rows/*.hex.txt",
    "assets/water_study/runtime_lite_phase_delta/*.json",
    "assets/water_study/runtime_lite_phase_delta/*.md",
    "assets/water_study/runtime_lite_phase_delta/docs/*.txt",
    "assets/water_study/runtime_lite_phase_delta/docs/*.md",
    "assets/water_study/runtime_lite_phase_delta/delta_chunks/*/*.dhex",
    "assets/water_study/wtr002_surface_caustics/*.json",
    "assets/water_study/wtr002_surface_caustics/*.md",
    "assets/water_study/wtr002_surface_caustics/hex_rows/*.hex.txt",
    "assets/water_study/wtr_look03_highlights/*.json",
    "assets/water_study/wtr_look03_highlights/*.md",
    "assets/water_study/wtr_look03_highlights/hex_rows/*.hex.txt",
    "assets/water_study/approved_production/*.json",
    "assets/water_study/approved_production/*.py",
    "assets/water_study/approved_production/docs/*.txt",
    "assets/water_study/approved_production/chunks_256/hex/*.hex.txt",
    "assets/water_study/approved_production/runtime_lite/*.json",
    "assets/water_study/approved_production/runtime_lite/dhex/*/*.dhex",
    "assets/water_study/approved_look04_plus_sparkle/*.json",
    "assets/water_study/approved_look04_plus_sparkle/*.md",
    "assets/water_study/approved_look04_plus_sparkle/*.py",
    "assets/water_study/approved_look04_plus_sparkle/data/*.json",
    "assets/water_study/approved_look04_plus_sparkle/docs/*.txt",
    "assets/water_study/approved_look04_plus_sparkle/docs/*.md",
    "assets/water_study/approved_look04_plus_sparkle/chunks_256/hex/*.hex.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs/prototype_spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
