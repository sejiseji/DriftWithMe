[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-with-me"
version = "0.1.0"
description = "A Pyxel game prototype scaffold for DriftWithMe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyxel==2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
drift-with-me = "drift_with_me.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_with_me = ["data/*.json", "assets/*.json", "assets/*.hex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs/prototype_spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
